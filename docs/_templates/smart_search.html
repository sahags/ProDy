{% extends "!layout.html" %}

{% block content %}
<div class="document" style="max-width: 700px;">
  <h1>Smart Search</h1>

  <form id="smartSearchForm">
    <input id="smartSearchInput"
           style="width: 100%; padding: 10px; font-size: 16px;"
           placeholder="Search function name (e.g. parsePDB)" />
    <button type="submit" style="margin-top: 10px; padding: 8px 12px;">Search</button>
  </form>

  <p id="smartSearchStatus" style="margin-top: 10px; opacity: 0.8;"></p>
</div>

<script src="{{ pathto('_static/smart_search.js', 1) }}"></script>
{% endblock %}
